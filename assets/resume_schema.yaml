# Canonical YAML Schema for plain_text_resume*.yaml (version 2)
# The field names mirror src/resume_schemas/resume.py.

professional_summary: {type: string, optional: true}

personal_information:
  type: object
  properties:
    full_name: {type: string}
    name: {type: string}
    surname: {type: string}
    date_of_birth: {type: string}
    country: {type: string}
    zip_code: {type: string}
    city: {type: string}
    address: {type: string}
    phone_prefix: {type: string}
    phone: {type: string}
    email: {type: string, format: email}
    github: {type: string}
    linkedin: {type: string}
    wechat: {type: string}

education_details:
  type: array
  items:
    type: object
    properties:
      education_level: {type: string}
      institution: {type: string}
      field_of_study: {type: string}
      final_evaluation_grade: {type: string}
      year_of_completion: {type: integer, nullable: true}
      start_date: {type: string}
      research_direction: {type: string}
      research_topics:
        type: array
        items: {type: string}
      additional_info:
        type: object
        properties:
          is_211: {type: boolean, nullable: true}
          is_double_first_class: {type: boolean, nullable: true}
          college: {type: string}
          study_mode: {type: string}
          honors: {type: string}
          relevant_courses: {type: string}
      exam:
        description: Course-to-grade mappings; canonical location is the education entry.
        oneOf:
          - {type: object}
          - {type: array}

experience_details:
  type: array
  items:
    type: object
    properties:
      position: {type: string}
      company: {type: string}
      employment_period: {type: string}
      location: {type: string}
      industry: {type: string}
      key_responsibilities:
        type: array
        items: {type: object}
      skills_acquired:
        type: array
        items: {type: string}

projects:
  type: array
  items:
    type: object
    properties:
      name: {type: string}
      description: {type: string}
      link: {type: string}

achievements:
  type: array
  items:
    type: object
    properties:
      name: {type: string}
      description: {type: string}

certifications:
  type: array
  items:
    type: object
    properties:
      name: {type: string}
      description: {type: string}

languages:
  type: array
  items:
    type: object
    properties:
      language: {type: string}
      proficiency: {type: string}

interests:
  type: array
  items: {type: string}

availability:
  type: object
  properties:
    notice_period: {type: string}

salary_expectations:
  type: object
  properties:
    salary_range_usd: {type: string}

self_identification:
  type: object
  properties:
    gender: {type: string}
    pronouns: {type: string}
    veteran: {type: string}
    disability: {type: string}
    ethnicity: {type: string}

legal_authorization:
  type: object
  properties:
    eu_work_authorization: {type: string}
    us_work_authorization: {type: string}
    requires_us_visa: {type: string}
    requires_us_sponsorship: {type: string}
    requires_eu_visa: {type: string}
    legally_allowed_to_work_in_eu: {type: string}
    legally_allowed_to_work_in_us: {type: string}
    requires_eu_sponsorship: {type: string}
    canada_work_authorization: {type: string}
    requires_canada_visa: {type: string}
    legally_allowed_to_work_in_canada: {type: string}
    requires_canada_sponsorship: {type: string}
    uk_work_authorization: {type: string}
    requires_uk_visa: {type: string}
    legally_allowed_to_work_in_uk: {type: string}
    requires_uk_sponsorship: {type: string}

work_preferences:
  type: object
  properties:
    remote_work: {type: string}
    in_person_work: {type: string}
    open_to_relocation: {type: string}
    willing_to_complete_assessments: {type: string}
    willing_to_undergo_drug_tests: {type: string}
    willing_to_undergo_background_checks: {type: string}
