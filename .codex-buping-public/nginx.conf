limit_req_zone $binary_remote_addr zone=public_api_rate:10m rate=10r/m;
limit_conn_zone $server_name zone=public_ai_global:10m;

server {
    listen 80;
    server_name buping.asia 8.148.70.104 _;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 8.148.70.104 _;

    ssl_certificate /etc/letsencrypt/live/8.148.70.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.148.70.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    location ~ ^/api/(resume/(generate|rewrite|save-edited)|interview/|settings/(models|upload-resume)|ai/) {
        limit_conn public_ai_global 1;
        limit_req zone=public_api_rate burst=5 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://buping:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/settings {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        proxy_pass http://buping:8000;
    }
    location = /api/settings/resume-content {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        proxy_pass http://buping:8000;
    }
    location ~ ^/api/(history|memory|ai-metrics|resume/versions) { return 404; }
    location ~ ^/api/job-tracker($|/(stats|path)) { return 404; }

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://buping:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / { proxy_pass http://buping:8000; }
}

